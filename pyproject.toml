[project]
name = "chessbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brebou", email = "brewgui@mailo.bzh" }
]
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.32.0",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "python-chess>=1.999",
    "safetensors>=0.8.0",
    "stockfish>=5.2.0",
    "torch>=2.15.0",
]

[project.scripts]
chessbot = "chessbot:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
